<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI设计师工作台</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <script src="/static/vendor/js/lucide.js?v=2026.07.17.1782696749"></script>
    <link rel="stylesheet" href="/static/css/workbench.css?v=2026.07.29.1">
</head>
<body>
    <div class="preview-shell">
        <header class="preview-top-dock" aria-label="工作台导航">
            <button class="preview-brand" type="button" data-open-page="workbench">
                <span class="brand-mark">
                    <img src="/static/images/logo.png" alt="">
                </span>
                <span>
                    <strong>AI设计师</strong>
                    <small>Creative Workbench</small>
                </span>
            </button>

            <nav class="preview-nav" aria-label="主要入口">
                <button class="nav-chip muted user-chip" type="button" data-open-page="team-cloud">
                    <i data-lucide="user-round" class="icon"></i>
                    <span id="workbenchUserLabel">未登录</span>
                    <i data-lucide="sliders-horizontal" class="icon"></i>
                </button>
                <button class="nav-chip" type="button" data-open-page="team-cloud">
                    <span>灵感点</span>
                    <strong id="workbenchInspirationPoints">0</strong>
                    <i data-lucide="refresh-cw" class="icon"></i>
                </button>
                <button class="nav-chip compact" type="button" aria-label="积分">
                    <i data-lucide="gem" class="icon"></i>
                    <span>0</span>
                </button>
                <button class="nav-chip primary" type="button" data-open-page="workbench">
                    <i data-lucide="home" class="icon"></i>
                    <span>用户主页</span>
                </button>
                <button class="nav-chip" type="button" data-open-page="canvas">
                    <i data-lucide="layout-grid" class="icon"></i>
                    <span>AI画布</span>
                </button>
                <button class="nav-chip" type="button" data-open-page="team-cloud">
                    <i data-lucide="users" class="icon"></i>
                    <span>团队</span>
                </button>
                <button class="nav-chip" type="button" data-open-page="asset-manager">
                    <i data-lucide="folder-open" class="icon"></i>
                    <span>素材库</span>
                </button>
                <button class="nav-chip" type="button" data-open-page="comfyui-settings">
                    <i data-lucide="route" class="icon"></i>
                    <span>工作流</span>
                </button>
                <button class="nav-chip icon-only" type="button" data-open-page="api-settings" title="API 设置" aria-label="API 设置">
                    <i data-lucide="settings" class="icon"></i>
                </button>
                <button class="nav-chip icon-only" type="button" data-theme-toggle title="黑白切换" aria-label="黑白切换">
                    <i data-lucide="moon-star" class="icon"></i>
                </button>
            </nav>
        </header>

        <aside class="preview-quick-rail" aria-label="快捷入口">
            <button class="rail-create" type="button" data-workbench-generate title="生成高级设计">
                <i data-lucide="plus" class="icon"></i>
                <span>生成</span>
            </button>
            <button class="active" type="button" data-open-page="workbench" title="主页">
                <i data-lucide="home" class="icon"></i>
                <span>主页</span>
            </button>
            <button type="button" data-open-page="canvas" title="AI画布">
                <i data-lucide="layout-grid" class="icon"></i>
                <span>AI画布</span>
            </button>
            <button type="button" data-open-page="canvas" data-visibility-target="private" title="私有画布">
                <i data-lucide="lock-keyhole" class="icon"></i>
                <span>私有画布</span>
            </button>
            <button type="button" data-open-page="canvas" title="历史创作">
                <i data-lucide="history" class="icon"></i>
                <span>历史创作</span>
            </button>
            <button type="button" data-tools-toggle aria-expanded="false" title="更多创作工具">
                <i data-lucide="sparkles" class="icon"></i>
                <span>创作工具</span>
            </button>
            <div class="rail-tool-popover" hidden>
                <button type="button" data-open-page="zimage">
                    <i data-lucide="image" class="icon"></i>
                    <span>文生图</span>
                </button>
                <button type="button" data-open-page="enhance">
                    <i data-lucide="zap" class="icon"></i>
                    <span>细节增强</span>
                </button>
                <button type="button" data-open-page="klein">
                    <i data-lucide="pen-line" class="icon"></i>
                    <span>图片编辑</span>
                </button>
                <button type="button" data-open-page="angle">
                    <i data-lucide="box" class="icon"></i>
                    <span>角度控制</span>
                </button>
                <button type="button" data-open-page="online">
                    <i data-lucide="globe-2" class="icon"></i>
                    <span>在线生图</span>
                </button>
                <button type="button" data-open-page="gpt-chat">
                    <i data-lucide="messages-square" class="icon"></i>
                    <span>GPT 对话</span>
                </button>
            </div>
        </aside>

        <main class="preview-main">
            <section class="preview-hero" aria-label="AI设计师">
                <div class="hero-avatar-wrap" aria-hidden="true">
                    <span class="avatar-orbit one"></span>
                    <span class="avatar-orbit two"></span>
                    <img src="/static/images/workbench-character.png?v=2026.07.28.6" alt="" class="hero-avatar character">
                </div>
                <div class="hero-pill">团队内容专用</div>
                <h1>AI设计师</h1>
                <p>上传参考图，输入需求，生成高级设计作品。使用最新的生图模型。</p>
                <button class="mini-cta" type="button" data-feedback-open>体验反馈</button>
            </section>

            <section class="preview-composer" aria-label="创作输入区">
                <div class="composer-topline">
                    <div>
                        <span>创意输入区</span>
                        <h2>描述你想生成的设计画面</h2>
                    </div>
                    <button class="round-icon-btn" type="button" data-clear-prompt title="清空输入" aria-label="清空输入">
                        <i data-lucide="refresh-cw" class="icon"></i>
                    </button>
                </div>

                <textarea id="promptInput" placeholder="例如：为城市展厅设计一张建筑概念图，玻璃幕墙、金红色灯带、入口有水景和人流，高级夜景摄影质感。"></textarea>

                <div class="preview-tools" aria-label="创作参数">
                    <button class="tool-chip upload" type="button" data-upload-placeholder>
                        <i data-lucide="plus" class="icon"></i>
                        <span>
                            <strong>上传参考图</strong>
                            <small>0张参考图</small>
                        </span>
                    </button>
                    <button class="tool-chip" type="button" data-url-placeholder>
                        <i data-lucide="plus" class="icon"></i>
                        <span>
                            <strong>上传 URL</strong>
                            <small>保存一个网页链接</small>
                        </span>
                    </button>
                    <label class="select-chip">
                        <span>尺寸：</span>
                        <select id="sizeSelect">
                            <option>智能比例</option>
                            <option>1:1</option>
                            <option>16:9</option>
                            <option>9:16</option>
                        </select>
                        <i data-lucide="chevron-down" class="icon"></i>
                    </label>
                    <label class="select-chip">
                        <span>分辨率:</span>
                        <select id="resolutionSelect">
                            <option>2K</option>
                            <option>1K</option>
                            <option>4K</option>
                        </select>
                        <i data-lucide="chevron-down" class="icon"></i>
                    </label>
                    <label class="select-chip model">
                        <span>生图模型</span>
                        <select id="modelSelect">
                            <option>gpt-image-2</option>
                            <option>团队默认模型</option>
                        </select>
                        <i data-lucide="chevron-down" class="icon"></i>
                    </label>
                </div>

                <div class="preview-actions">
                    <span id="composerStatus">准备就绪</span>
                    <div>
                        <button class="action-pill ghost" type="button" data-open-page="gpt-chat">
                            <i data-lucide="sparkles" class="icon"></i>
                            <span>优化提示词</span>
                        </button>
                        <button class="action-pill hot" type="button" data-workbench-generate>
                            <i data-lucide="wand-sparkles" class="icon"></i>
                            <span>生成高级设计</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="preview-library" aria-label="作品资产库">
                <div class="library-head">
                    <div>
                        <span>最新作品与资产</span>
                        <h2>作品资产库</h2>
                    </div>
                    <button type="button" data-open-page="canvas">
                        <i data-lucide="eye" class="icon"></i>
                        <span>查看全部</span>
                    </button>
                </div>
                <div class="library-grid">
                    <button class="library-card red" type="button" data-open-page="canvas" data-recent-canvas-card>
                        <span class="library-card-bg" aria-hidden="true"></span>
                        <span>Canvas</span>
                        <strong>团队云端画布</strong>
                    </button>
                    <button class="library-card amber" type="button" data-open-page="asset-manager" data-frequent-assets-card>
                        <span class="library-card-bg" aria-hidden="true"></span>
                        <span>Assets</span>
                        <strong>参考图与素材库</strong>
                    </button>
                    <button class="library-card green" type="button" data-open-page="team-cloud">
                        <span>Team</span>
                        <strong>成员与历史版本</strong>
                    </button>
                </div>
            </section>
        </main>

        <div class="feedback-modal" id="feedbackModal" hidden>
            <div class="feedback-card" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
                <div class="feedback-head">
                    <h2 id="feedbackTitle">体验反馈</h2>
                    <button class="round-icon-btn" type="button" data-feedback-close title="关闭" aria-label="关闭">
                        <i data-lucide="x" class="icon"></i>
                    </button>
                </div>
                <textarea id="feedbackInput" placeholder="写下你遇到的问题、想要的功能或页面建议。"></textarea>
                <p id="feedbackStatus">反馈会保存到后台，后续可做管理页查看。</p>
                <div class="feedback-actions">
                    <button class="action-pill ghost" type="button" data-feedback-close>取消</button>
                    <button class="action-pill hot" type="button" data-feedback-submit>发送反馈</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/workbench.js?v=2026.07.28.6"></script>
</body>
</html>
