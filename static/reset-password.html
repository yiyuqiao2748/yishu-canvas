<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --line: #dfe5e2;
            --text: #151817;
            --muted: #68736f;
            --accent: #157a6e;
            --accent-strong: #0d5f56;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(420px, 100%);
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 18px 48px rgba(15, 23, 42, .08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 1.2;
        }

        .sub {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 12px;
        }

        label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
        }

        input {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0 12px;
            font: inherit;
        }

        input:focus {
            border-color: rgba(21, 122, 110, .58);
            box-shadow: 0 0 0 3px rgba(21, 122, 110, .12);
            outline: none;
        }

        button,
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        a.btn:hover {
            background: var(--accent-strong);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .message.error {
            color: var(--danger);
        }

        .message.ok {
            color: var(--accent-strong);
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>重置密码</h1>
        <p class="sub">请输入新密码。完成后会回到团队画布页面。</p>
        <form id="resetForm">
            <div class="field">
                <label for="password">新密码</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="field">
                <label for="confirmPassword">再次输入新密码</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="actions">
                <button id="submitBtn" type="submit">保存新密码</button>
                <a class="btn" href="/static/team-cloud.html">返回登录</a>
            </div>
        </form>
        <div class="message" id="message"></div>
    </main>

    <script>
        (function(){
            const form = document.getElementById("resetForm");
            const submitBtn = document.getElementById("submitBtn");
            const message = document.getElementById("message");
            const params = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
            const accessToken = params.get("access_token") || "";

            function setMessage(text, type){
                message.textContent = text || "";
                message.classList.remove("error", "ok");
                if(type) message.classList.add(type);
            }

            if(!accessToken){
                form.querySelectorAll("input,button").forEach((item) => item.disabled = true);
                setMessage("重置链接无效或已过期，请重新发送找回密码邮件。", "error");
                return;
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                if(password !== confirmPassword){
                    setMessage("两次输入的密码不一致。", "error");
                    return;
                }
                submitBtn.disabled = true;
                setMessage("正在保存新密码...");
                try {
                    const response = await fetch("/api/team-cloud/auth/password", {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${accessToken}`,
                        },
                        body: JSON.stringify({ password }),
                    });
                    let data = {};
                    try {
                        data = await response.json();
                    } catch(e) {}
                    if(!response.ok){
                        throw new Error(data.detail || data.message || "密码更新失败");
                    }
                    setMessage("密码已更新，正在进入团队画布...", "ok");
                    window.setTimeout(() => {
                        window.location.href = "/static/team-cloud.html";
                    }, 900);
                } catch(error) {
                    submitBtn.disabled = false;
                    setMessage(error.message || "密码更新失败", "error");
                }
            });
        })();
    </script>
</body>
</html>
