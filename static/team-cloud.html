<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.23.1784872856"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.07.23.1784872856');

        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-2: #f1f5f4;
            --line: #dfe5e2;
            --text: #151817;
            --muted: #68736f;
            --accent: #157a6e;
            --accent-strong: #0d5f56;
            --danger: #b42318;
            --warning: #996f00;
            --shadow: 0 18px 48px rgba(15, 23, 42, .08);
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --surface: #151b26;
            --surface-2: #202837;
            --line: #2b3546;
            --text: #e8edf5;
            --muted: #96a3b6;
            --accent: #2dd4bf;
            --accent-strong: #5eead4;
            --danger: #f87171;
            --warning: #fbbf24;
            --shadow: 0 18px 48px rgba(0, 0, 0, .32);
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            width: min(1180px, calc(100vw - 40px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .title-wrap {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 760;
        }

        .sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .status.ok {
            color: var(--accent-strong);
            border-color: rgba(21, 122, 110, .28);
        }

        .status.warn {
            color: var(--warning);
            border-color: rgba(153, 111, 0, .24);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(300px, 380px) 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel.wide {
            grid-column: 1 / -1;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
        }

        .panel-title {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 720;
        }

        .panel-body {
            padding: 18px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            margin-bottom: 16px;
        }

        .tab {
            height: 34px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .tab.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(15, 23, 42, .08);
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 650;
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            padding: 0 11px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(21, 122, 110, .58);
            box-shadow: 0 0 0 3px rgba(21, 122, 110, .12);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row > * {
            min-width: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 13px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }

        .btn.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--accent-strong);
        }

        .btn.ghost:hover {
            background: var(--surface-2);
        }

        .btn.danger {
            color: var(--danger);
        }

        .btn.danger:hover {
            border-color: rgba(248, 113, 113, .45);
            background: rgba(248, 113, 113, .1);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .message.error {
            color: var(--danger);
        }

        .message.ok {
            color: var(--accent-strong);
        }

        .auth-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .link-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 0;
            min-height: auto;
            cursor: pointer;
            font-size: 13px;
        }

        .link-btn:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        .empty {
            padding: 28px 18px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--surface-2);
        }

        .team-list,
        .member-list,
        .api-list,
        .log-list {
            display: grid;
            gap: 8px;
        }

        .team-item,
        .member-item,
        .api-item,
        .log-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 52px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .api-item button {
            min-width: 40px;
        }

        .team-api-layout {
            display: grid;
            grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .team-api-sidebar,
        .team-api-main {
            display: grid;
            gap: 12px;
        }

        .team-api-sidebar {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .team-api-section-title {
            color: var(--muted);
            font-size: 12px;
            font-weight: 760;
        }

        .team-api-provider-list {
            display: grid;
            gap: 8px;
        }

        .team-api-provider-card {
            width: 100%;
            min-height: 56px;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            text-align: left;
        }

        .team-api-provider-card.active {
            border-color: rgba(21, 122, 110, .42);
            background: rgba(21, 122, 110, .1);
        }

        .team-api-provider-card.missing-key .api-mark {
            color: var(--muted);
        }

        .team-api-provider-card.has-key .api-mark {
            color: var(--accent-strong);
        }

        .api-mark {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .api-card-name {
            display: block;
            font-size: 13px;
            font-weight: 760;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-card-meta {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-protocol-pill {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .team-api-editor-head,
        .team-api-block {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .team-api-editor-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
        }

        .team-api-editor-title {
            font-size: 20px;
            line-height: 1.2;
            font-weight: 800;
        }

        .team-api-editor-sub {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .team-api-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .team-api-block {
            padding: 18px;
        }

        .team-api-block-head {
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .team-api-block-title {
            font-size: 14px;
            font-weight: 800;
        }

        .team-api-block-desc {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .key-input-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .model-section-list {
            display: grid;
            gap: 18px;
        }

        .model-section {
            display: grid;
            gap: 10px;
        }

        .model-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .model-section-title {
            font-size: 13px;
            font-weight: 800;
        }

        .model-section-sub {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .model-chip-list {
            min-height: 58px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--surface-2);
        }

        .model-editor {
            width: 100%;
            min-height: 92px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
        }

        .model-chip {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
            font-weight: 650;
        }

        .team-item {
            cursor: pointer;
        }

        .team-item.active {
            border-color: rgba(21, 122, 110, .42);
            background: rgba(21, 122, 110, .1);
        }

        .item-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .item-actions .btn {
            min-width: 40px;
            padding: 0 10px;
        }

        .name {
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
            white-space: nowrap;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 860px) {
            .page {
                width: min(100vw - 24px, 680px);
                padding-top: 18px;
            }

            .topbar,
            .layout,
            .team-api-layout,
            .split {
                grid-template-columns: 1fr;
            }

            .topbar {
                display: grid;
            }

            .status {
                justify-content: center;
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="title-wrap">
                <h1>团队画布</h1>
                <div class="sub" id="userLine">未登录</div>
            </div>
            <div class="status" id="systemStatus">
                <i data-lucide="loader-circle" width="16" height="16"></i>
                <span>连接中</span>
            </div>
        </header>

        <div class="layout">
            <section class="panel" id="authPanel">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="shield-check" width="18" height="18"></i>
                        <span>账户</span>
                    </div>
                    <button class="btn ghost" id="logoutBtn" type="button" hidden>
                        <i data-lucide="log-out" width="16" height="16"></i>
                        <span>退出</span>
                    </button>
                </div>
                <div class="panel-body">
                    <div id="signedOut">
                        <div class="tabs" role="tablist" aria-label="账户操作">
                            <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">登录</button>
                            <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">注册</button>
                        </div>
                        <form id="authForm">
                            <div class="field" id="usernameField" hidden>
                                <label for="username">账号名</label>
                                <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" placeholder="例如 yiwei">
                            </div>
                            <div class="field">
                                <label for="authIdentifier" id="authIdentifierLabel">账号 / 邮箱</label>
                                <input id="authIdentifier" name="identifier" type="text" autocomplete="username" required>
                            </div>
                            <div class="field">
                                <label for="password">密码</label>
                                <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
                            </div>
                            <button class="btn primary" id="authSubmit" type="submit">
                                <i data-lucide="log-in" width="16" height="16"></i>
                                <span>登录</span>
                            </button>
                            <div class="auth-actions">
                                <button class="link-btn" id="recoverPasswordBtn" type="button">忘记密码？</button>
                            </div>
                        </form>
                    </div>
                    <div id="signedIn" hidden>
                        <div class="name" id="signedInName">-</div>
                        <div class="meta" id="signedInProvider">-</div>
                    </div>
                    <div class="message" id="authMessage"></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="users" width="18" height="18"></i>
                        <span>团队</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="split">
                        <form id="teamForm">
                            <div class="field">
                                <label for="teamName">新团队</label>
                                <input id="teamName" name="teamName" type="text" maxlength="80" required>
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="plus" width="16" height="16"></i>
                                <span>创建团队</span>
                            </button>
                        </form>

                        <form id="inviteForm">
                            <div class="row">
                                <div class="field" style="flex:1">
                                    <label for="inviteEmail">邀请邮箱</label>
                                    <input id="inviteEmail" name="inviteEmail" type="email" required>
                                </div>
                                <div class="field" style="width:120px">
                                    <label for="inviteRole">角色</label>
                                    <select id="inviteRole" name="inviteRole">
                                        <option value="member">成员</option>
                                        <option value="admin">管理员</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn" type="submit">
                                <i data-lucide="mail-plus" width="16" height="16"></i>
                                <span>邀请</span>
                            </button>
                        </form>
                    </div>

                    <div class="message" id="teamMessage"></div>
                    <div class="split" style="margin-top:16px">
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="folder-kanban" width="17" height="17"></i>
                                <span>我的团队</span>
                            </div>
                            <div class="team-list" id="teamList"></div>
                        </div>
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="user-round" width="17" height="17"></i>
                                <span>成员</span>
                            </div>
                            <div class="member-list" id="memberList"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel wide">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="panel-top" width="18" height="18"></i>
                        <span>项目与画布</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="split">
                        <form id="projectForm">
                            <div class="field">
                                <label for="projectName">新项目</label>
                                <input id="projectName" name="projectName" type="text" maxlength="120" required>
                            </div>
                            <div class="field">
                                <label for="projectDescription">备注</label>
                                <input id="projectDescription" name="projectDescription" type="text" maxlength="500">
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="folder-plus" width="16" height="16"></i>
                                <span>创建项目</span>
                            </button>
                        </form>

                        <form id="canvasForm">
                            <div class="field">
                                <label for="canvasTitle">新画布</label>
                                <input id="canvasTitle" name="canvasTitle" type="text" maxlength="120" required>
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="file-plus-2" width="16" height="16"></i>
                                <span>创建画布</span>
                            </button>
                        </form>
                    </div>

                    <div class="message" id="projectMessage"></div>
                    <div class="split" style="margin-top:16px">
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="folders" width="17" height="17"></i>
                                <span>团队项目</span>
                            </div>
                            <div class="team-list" id="projectList"></div>
                        </div>
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="layout-dashboard" width="17" height="17"></i>
                                <span>云端画布</span>
                            </div>
                            <div class="member-list" id="canvasList"></div>
                        </div>
                    </div>
                    <div style="margin-top:16px">
                        <div class="panel-title" style="margin-bottom:10px">
                            <i data-lucide="history" width="17" height="17"></i>
                            <span>Version history</span>
                        </div>
                        <div class="member-list" id="canvasVersionList"></div>
                    </div>
                </div>
            </section>

            <section class="panel wide">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="key-round" width="18" height="18"></i>
                        <span>团队 API</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="team-api-layout">
                        <aside class="team-api-sidebar">
                            <div class="team-api-section-title">平台列表</div>
                            <div class="team-api-provider-list" id="apiProviderList"></div>
                            <button class="btn" id="apiProviderAdd" type="button">
                                <i data-lucide="plus" width="16" height="16"></i>
                                <span>新增平台</span>
                            </button>
                            <button class="btn primary" id="apiProviderRecommend" type="button">
                                <i data-lucide="sparkles" width="16" height="16"></i>
                                <span>推荐API</span>
                            </button>
                        </aside>

                        <div class="team-api-main">
                            <div class="team-api-editor-head">
                                <div>
                                    <div class="team-api-editor-title" id="apiEditorTitle">API</div>
                                    <div class="team-api-editor-sub">配置团队专用地址、API Key 和协议</div>
                                </div>
                                <div class="team-api-actions">
                                    <button class="btn ghost danger" id="apiProviderDelete" type="button">
                                        <i data-lucide="trash-2" width="16" height="16"></i>
                                        <span>删除</span>
                                    </button>
                                    <button class="btn" id="apiProviderValidate" type="button">
                                        <i data-lucide="badge-check" width="16" height="16"></i>
                                        <span>验证地址</span>
                                    </button>
                                    <button class="btn primary" id="apiProviderSubmit" type="submit" form="apiProviderForm">
                                        <i data-lucide="save" width="16" height="16"></i>
                                        <span>保存</span>
                                    </button>
                                </div>
                            </div>

                            <form id="apiProviderForm" class="team-api-block">
                                <div class="team-api-block-head">
                                    <div class="team-api-block-title">基本信息</div>
                                    <div class="team-api-block-desc">平台显示名、唯一 ID 和请求地址</div>
                                </div>
                                <div class="field">
                                    <label for="apiProviderLabel">平台名称</label>
                                    <input id="apiProviderLabel" name="apiProviderLabel" type="text" maxlength="80" required>
                                    <input id="apiProviderId" name="apiProviderId" type="hidden">
                                    <div class="meta">平台 ID：<span id="apiProviderIdPreview">-</span></div>
                                </div>
                                <div class="field">
                                    <label for="apiProviderBaseUrl">请求地址</label>
                                    <input id="apiProviderBaseUrl" name="apiProviderBaseUrl" type="url" placeholder="https://api.example.com/v1">
                                </div>
                                <div class="split">
                                    <div class="field">
                                        <label for="apiProviderKey">API Key</label>
                                        <div class="key-input-line">
                                            <input id="apiProviderKey" name="apiProviderKey" type="password" autocomplete="off" placeholder="输入 API Key">
                                            <button class="btn" id="apiProviderClearKey" type="button" title="清除 Key">
                                                <i data-lucide="trash-2" width="16" height="16"></i>
                                            </button>
                                        </div>
                                        <div class="meta" id="apiProviderKeyHint">还没有保存 Key。</div>
                                    </div>
                                    <div class="field">
                                        <label for="apiProviderProtocol">协议</label>
                                        <select id="apiProviderProtocol" name="apiProviderProtocol">
                                            <option value="openai">OpenAI 直连</option>
                                            <option value="runninghub">RunningHub</option>
                                            <option value="volcengine">火山引擎</option>
                                            <option value="gemini">Gemini</option>
                                            <option value="apimart">APIMart</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="field" id="apiProviderWalletField">
                                    <label for="apiProviderWalletKey">备用/钱包 Key</label>
                                    <input id="apiProviderWalletKey" name="apiProviderWalletKey" type="password" autocomplete="off" placeholder="RunningHub 可选">
                                    <div class="meta" id="apiProviderWalletHint">可选。</div>
                                </div>
                            </form>

                            <section class="team-api-block">
                                <div class="team-api-block-head">
                                    <div class="model-section-head">
                                        <div>
                                            <div class="team-api-block-title">模型列表</div>
                                            <div class="team-api-block-desc">可手动维护模型，OpenAI 兼容接口也可以自动拉取。</div>
                                        </div>
                                        <button class="btn" id="apiProviderFetchModels" type="button">
                                            <i data-lucide="cloud-download" width="16" height="16"></i>
                                            <span>拉取模型</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="model-section-list">
                                    <div class="model-section">
                                        <div>
                                            <div class="model-section-title">生图模型</div>
                                            <div class="model-section-sub">在线生图和无限画布 API 生成使用。</div>
                                        </div>
                                        <div class="model-chip-list" id="apiImageModelList"></div>
                                        <textarea class="model-editor" id="apiImageModels" rows="4" placeholder="一行一个生图模型，例如 gpt-image-1"></textarea>
                                    </div>
                                    <div class="model-section">
                                        <div>
                                            <div class="model-section-title">聊天模型</div>
                                            <div class="model-section-sub">GPT 对话和 LLM 节点使用。</div>
                                        </div>
                                        <div class="model-chip-list" id="apiChatModelList"></div>
                                        <textarea class="model-editor" id="apiChatModels" rows="4" placeholder="一行一个聊天模型，例如 gpt-4o"></textarea>
                                    </div>
                                    <div class="model-section">
                                        <div>
                                            <div class="model-section-title">视频模型</div>
                                            <div class="model-section-sub">无限画布视频生成节点使用。</div>
                                        </div>
                                        <div class="model-chip-list" id="apiVideoModelList"></div>
                                        <textarea class="model-editor" id="apiVideoModels" rows="4" placeholder="一行一个视频模型，例如 wan-video"></textarea>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                    <div class="message" id="apiMessage"></div>
                </div>
            </section>

            <section class="panel wide">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="activity" width="18" height="18"></i>
                        <span>调用日志</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="log-list" id="generationLogSummary"></div>
                    <div class="log-list" id="generationLogList"></div>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/js/team-cloud.js?v=2026.07.26.11"></script>
</body>
</html>
