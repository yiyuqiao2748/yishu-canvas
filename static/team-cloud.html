<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.07.29.3"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.07.29.3');

        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --surface-2: #f1f5f4;
            --line: #dfe5e2;
            --text: #151817;
            --muted: #68736f;
            --accent: #157a6e;
            --accent-strong: #0d5f56;
            --danger: #b42318;
            --warning: #996f00;
            --shadow: 0 18px 48px rgba(15, 23, 42, .08);
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --surface: #151b26;
            --surface-2: #202837;
            --line: #2b3546;
            --text: #e8edf5;
            --muted: #96a3b6;
            --accent: #2dd4bf;
            --accent-strong: #5eead4;
            --danger: #f87171;
            --warning: #fbbf24;
            --shadow: 0 18px 48px rgba(0, 0, 0, .32);
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            width: min(1180px, calc(100vw - 40px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .title-wrap {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 760;
        }

        .sub {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .status.ok {
            color: var(--accent-strong);
            border-color: rgba(21, 122, 110, .28);
        }

        .status.warn {
            color: var(--warning);
            border-color: rgba(153, 111, 0, .24);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(300px, 380px) 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel.wide {
            grid-column: 1 / -1;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
        }

        .panel-title {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 720;
        }

        .panel-body {
            padding: 18px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            margin-bottom: 16px;
        }

        .tab {
            height: 34px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .tab.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(15, 23, 42, .08);
        }

        .field {
            display: grid;
            gap: 7px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 650;
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            padding: 0 11px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(21, 122, 110, .58);
            box-shadow: 0 0 0 3px rgba(21, 122, 110, .12);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row > * {
            min-width: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 13px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }

        .btn.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--accent-strong);
        }

        .btn.ghost:hover {
            background: var(--surface-2);
        }

        .btn.danger {
            color: var(--danger);
        }

        .btn.danger:hover {
            border-color: rgba(248, 113, 113, .45);
            background: rgba(248, 113, 113, .1);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .message.error {
            color: var(--danger);
        }

        .message.ok {
            color: var(--accent-strong);
        }

        .auth-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .link-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 0;
            min-height: auto;
            cursor: pointer;
            font-size: 13px;
        }

        .link-btn:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        .empty {
            padding: 28px 18px;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--surface-2);
        }

        .team-list,
        .member-list,
        .api-list,
        .log-list {
            display: grid;
            gap: 8px;
        }

        .team-item,
        .member-item,
        .api-item,
        .log-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 52px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .api-item button {
            min-width: 40px;
        }

        .team-api-layout {
            display: grid;
            grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .team-api-sidebar,
        .team-api-main {
            display: grid;
            gap: 12px;
        }

        .team-api-sidebar {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .team-api-section-title {
            color: var(--muted);
            font-size: 12px;
            font-weight: 760;
        }

        .team-api-provider-list {
            display: grid;
            gap: 8px;
        }

        .team-api-provider-card {
            width: 100%;
            min-height: 56px;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            text-align: left;
        }

        .team-api-provider-card.active {
            border-color: rgba(21, 122, 110, .42);
            background: rgba(21, 122, 110, .1);
        }

        .team-api-provider-card.missing-key .api-mark {
            color: var(--muted);
        }

        .team-api-provider-card.has-key .api-mark {
            color: var(--accent-strong);
        }

        .api-mark {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .api-card-name {
            display: block;
            font-size: 13px;
            font-weight: 760;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-card-meta {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .api-protocol-pill {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .team-api-editor-head,
        .team-api-block {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .team-api-editor-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
        }

        .team-api-editor-title {
            font-size: 20px;
            line-height: 1.2;
            font-weight: 800;
        }

        .team-api-editor-sub {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .team-api-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .team-api-block {
            padding: 18px;
        }

        .team-api-block-head {
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .team-api-block-title {
            font-size: 14px;
            font-weight: 800;
        }

        .team-api-block-desc {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .key-input-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .model-section-list {
            display: grid;
            gap: 18px;
        }

        .model-section {
            display: grid;
            gap: 10px;
        }

        .model-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .model-section-title {
            font-size: 13px;
            font-weight: 800;
        }

        .model-section-sub {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .team-api-model-list {
            display: grid;
            gap: 8px;
        }

        .team-api-model-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px 40px;
            gap: 8px;
            align-items: center;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
        }

        .team-api-model-row input,
        .team-api-model-row select {
            min-height: 34px;
            background: var(--surface);
        }

        .team-api-model-row .btn {
            min-width: 40px;
            min-height: 34px;
            padding: 0;
        }

        .team-api-model-empty {
            padding: 18px 12px;
        }

        .team-item {
            cursor: pointer;
        }

        .team-item.active {
            border-color: rgba(21, 122, 110, .42);
            background: rgba(21, 122, 110, .1);
        }

        .item-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .item-actions .btn {
            min-width: 40px;
            padding: 0 10px;
        }

        .name {
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
            white-space: nowrap;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 860px) {
            .page {
                width: min(100vw - 24px, 680px);
                padding-top: 18px;
            }

            .topbar,
            .layout,
            .team-api-layout,
            .split {
                grid-template-columns: 1fr;
            }

            .topbar {
                display: grid;
            }

            .status {
                justify-content: center;
                white-space: normal;
            }
        }
        /* 2026-07-28 secondary page workbench skin */
        :root {
            --ai-bg: #080608;
            --ai-panel: rgba(18, 13, 16, .78);
            --ai-card: rgba(255, 255, 255, .055);
            --ai-line: rgba(255, 255, 255, .11);
            --ai-line-hot: rgba(255, 138, 76, .32);
            --ai-text: #fff7ed;
            --ai-muted: rgba(255, 247, 237, .62);
            --ai-red: #dc2626;
            --ai-orange: #f97316;
        }

        body {
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                radial-gradient(circle at 14% 0%, rgba(127,29,29,.42), transparent 36%),
                radial-gradient(circle at 100% 10%, rgba(6,78,59,.24), transparent 34%),
                var(--ai-bg) !important;
            background-size: 42px 42px, 42px 42px, auto, auto;
            color: var(--ai-text) !important;
        }

        .page {
            width: min(1180px, calc(100vw - 40px));
            margin-top: 24px;
        }

        .page-head,
        .panel {
            border: 1px solid var(--ai-line) !important;
            background: var(--ai-panel) !important;
            box-shadow: 0 24px 72px rgba(0,0,0,.34) !important;
            backdrop-filter: blur(18px);
        }

        .panel,
        .team-api-block,
        .team-api-editor-head,
        .team-api-provider-card,
        .team-item,
        .log-item,
        .canvas-card,
        .project-card,
        .version-item {
            border-color: var(--ai-line) !important;
            background: var(--ai-card) !important;
            color: var(--ai-text) !important;
        }

        .panel-title,
        .section-title,
        .team-api-block-title,
        .team-api-editor-title,
        h1,
        h2,
        h3,
        label {
            color: var(--ai-text) !important;
        }

        .muted,
        .sub,
        .empty,
        .team-api-editor-sub,
        .team-api-block-desc,
        .team-api-model-empty,
        small {
            color: var(--ai-muted) !important;
        }

        input,
        textarea,
        select {
            border-color: rgba(255,255,255,.12) !important;
            background: rgba(0,0,0,.28) !important;
            color: var(--ai-text) !important;
        }

        /* native select menu contrast */
        select,
        select option,
        select optgroup {
            color-scheme:dark;
        }
        select option,
        select optgroup {
            background:#1f1718 !important;
            color:#fff7ed !important;
        }
        select option:checked {
            background:#dc2626 !important;
            color:#ffffff !important;
        }
        select option:disabled {
            background:#2a2020 !important;
            color:#b8aaa2 !important;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255,247,237,.38) !important;
        }

        .btn.primary,
        button.primary,
        .team-api-actions .btn.primary {
            border-color: rgba(255,211,141,.34) !important;
            background: linear-gradient(135deg, var(--ai-red), var(--ai-orange)) !important;
            color: #fff !important;
            box-shadow: 0 16px 34px rgba(220,38,38,.24) !important;
        }

        .btn,
        button {
            border-color: rgba(255,255,255,.12);
        }

        .team-api-provider-card.active,
        .team-item.active,
        .canvas-card:hover,
        .project-card:hover,
        .version-item:hover {
            border-color: var(--ai-line-hot) !important;
        }

        html,
        body {
            background:#080608 !important;
        }

        .page {
            background:
                radial-gradient(circle at 18% 13%, rgba(100,36,24,.48), transparent 24%),
                radial-gradient(circle at 82% 10%, rgba(21,73,54,.4), transparent 25%),
                linear-gradient(105deg, #43070d 0%, #211011 43%, #06100d 100%) !important;
            color:var(--ai-text) !important;
        }

        .panel,
        .account-card,
        .auth-card,
        .team-api-sidebar,
        .team-api-provider-card,
        .team-api-editor,
        .team-api-block,
        .usage-card,
        .log-list,
        .team-list,
        .member-list,
        .project-list,
        .canvas-list,
        .version-list {
            background:rgba(7,8,10,.48) !important;
            border-color:rgba(255,219,184,.13) !important;
            color:var(--ai-text) !important;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.025), 0 18px 48px rgba(0,0,0,.26) !important;
        }

        .empty,
        .team-api-model-empty,
        .log-empty,
        .canvas-empty,
        .project-empty {
            background:rgba(5,6,8,.56) !important;
            border:1px solid rgba(255,219,184,.1) !important;
            color:rgba(255,237,213,.58) !important;
        }

        .tabs,
        .tab,
        .auth-tabs,
        .auth-tab,
        .btn:not(.primary),
        button:not(.primary),
        .team-api-action-btn {
            background:rgba(255,255,255,.055) !important;
            border-color:rgba(255,255,255,.12) !important;
            color:var(--ai-muted) !important;
        }

        .tab.active,
        .auth-tab.active,
        .btn:not(.primary):hover,
        button:not(.primary):hover {
            background:rgba(244,63,63,.18) !important;
            border-color:rgba(255,138,76,.28) !important;
            color:var(--ai-text) !important;
        }

        /* Final team-page skin override. Earlier dark selectors use a blue slate
           palette; keep this page full-bleed and aligned with the home UI. */
        html.theme-dark,
        html.theme-dark body,
        html.studio-theme-dark,
        html.studio-theme-dark body,
        body.theme-dark,
        body.studio-theme-dark {
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                radial-gradient(circle at 16% 4%, rgba(127,29,29,.46), transparent 34%),
                radial-gradient(circle at 100% 0%, rgba(6,78,59,.28), transparent 34%),
                #080608 !important;
            background-size:42px 42px,42px 42px,auto,auto,auto !important;
            color:var(--ai-text) !important;
        }

        .page {
            width:100%;
            min-height:100vh;
            margin:0;
            padding:24px 70px 42px;
            background:
                radial-gradient(circle at 18% 13%, rgba(100,36,24,.34), transparent 24%),
                radial-gradient(circle at 82% 10%, rgba(21,73,54,.32), transparent 25%),
                linear-gradient(105deg, rgba(67,7,13,.9) 0%, rgba(33,16,17,.88) 43%, rgba(6,16,13,.94) 100%) !important;
        }

        .topbar {
            min-height:62px;
            padding:10px 14px 10px 18px;
            border:1px solid rgba(255,219,184,.13);
            border-radius:999px;
            background:rgba(18,13,16,.76);
            box-shadow:0 24px 72px rgba(0,0,0,.34);
            backdrop-filter:blur(18px);
        }

        .layout {
            margin-top:16px;
        }

        @media (max-width:860px) {
            .page {
                width:100%;
                padding:14px;
            }

            .topbar {
                border-radius:18px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="title-wrap">
                <h1>团队画布</h1>
                <div class="sub" id="userLine">未登录</div>
            </div>
            <div class="status" id="systemStatus">
                <i data-lucide="loader-circle" width="16" height="16"></i>
                <span>连接中</span>
            </div>
        </header>

        <div class="layout">
            <section class="panel" id="authPanel">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="shield-check" width="18" height="18"></i>
                        <span>账户</span>
                    </div>
                    <button class="btn ghost" id="logoutBtn" type="button" hidden>
                        <i data-lucide="log-out" width="16" height="16"></i>
                        <span>退出</span>
                    </button>
                </div>
                <div class="panel-body">
                    <div id="signedOut">
                        <div class="tabs" role="tablist" aria-label="账户操作">
                            <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">登录</button>
                            <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">注册</button>
                        </div>
                        <form id="authForm">
                            <div class="field" id="usernameField" hidden>
                                <label for="username">账号名</label>
                                <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" placeholder="例如 yiwei">
                            </div>
                            <div class="field">
                                <label for="authIdentifier" id="authIdentifierLabel">账号 / 邮箱</label>
                                <input id="authIdentifier" name="identifier" type="text" autocomplete="username" required>
                            </div>
                            <div class="field">
                                <label for="password">密码</label>
                                <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" aria-label="密码" required>
                            </div>
                            <button class="btn primary" id="authSubmit" type="submit">
                                <i data-lucide="log-in" width="16" height="16"></i>
                                <span>登录</span>
                            </button>
                            <div class="auth-actions">
                                <button class="link-btn" id="recoverPasswordBtn" type="button">忘记密码？</button>
                            </div>
                        </form>
                    </div>
                    <div id="signedIn" hidden>
                        <div class="name" id="signedInName">-</div>
                        <div class="meta" id="signedInProvider">-</div>
                    </div>
                    <div class="message" id="authMessage"></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="users" width="18" height="18"></i>
                        <span>团队</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="split">
                        <form id="teamForm">
                            <div class="field">
                                <label for="teamName">新团队</label>
                                <input id="teamName" name="teamName" type="text" maxlength="80" placeholder="输入团队名称" aria-label="新团队" required>
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="plus" width="16" height="16"></i>
                                <span>创建团队</span>
                            </button>
                        </form>

                        <form id="inviteForm">
                            <div class="row">
                                <div class="field" style="flex:1">
                                    <label for="inviteEmail">邀请邮箱</label>
                                    <input id="inviteEmail" name="inviteEmail" type="email" placeholder="name@example.com" aria-label="邀请邮箱" required>
                                </div>
                                <div class="field" style="width:120px">
                                    <label for="inviteRole">角色</label>
                                    <select id="inviteRole" name="inviteRole">
                                        <option value="member">成员</option>
                                        <option value="admin">管理员</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn" type="submit">
                                <i data-lucide="mail-plus" width="16" height="16"></i>
                                <span>邀请</span>
                            </button>
                        </form>
                    </div>

                    <div class="message" id="teamMessage"></div>
                    <div class="split" style="margin-top:16px">
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="folder-kanban" width="17" height="17"></i>
                                <span>我的团队</span>
                            </div>
                            <div class="team-list" id="teamList"></div>
                        </div>
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="user-round" width="17" height="17"></i>
                                <span>成员</span>
                            </div>
                            <div class="member-list" id="memberList"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel wide">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="panel-top" width="18" height="18"></i>
                        <span>项目与画布</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="split">
                        <form id="projectForm">
                            <div class="field">
                                <label for="projectName">新项目</label>
                                <input id="projectName" name="projectName" type="text" maxlength="120" placeholder="输入项目名称" aria-label="新项目" required>
                            </div>
                            <div class="field">
                                <label for="projectDescription">备注</label>
                                <input id="projectDescription" name="projectDescription" type="text" maxlength="500" placeholder="项目备注，可选" aria-label="备注">
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="folder-plus" width="16" height="16"></i>
                                <span>创建项目</span>
                            </button>
                        </form>

                        <form id="canvasForm">
                            <div class="field">
                                <label for="canvasTitle">新画布</label>
                                <input id="canvasTitle" name="canvasTitle" type="text" maxlength="120" placeholder="输入画布名称" aria-label="新画布" required>
                            </div>
                            <button class="btn primary" type="submit">
                                <i data-lucide="file-plus-2" width="16" height="16"></i>
                                <span>创建画布</span>
                            </button>
                        </form>
                    </div>

                    <div class="message" id="projectMessage"></div>
                    <div class="split" style="margin-top:16px">
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="folders" width="17" height="17"></i>
                                <span>团队项目</span>
                            </div>
                            <div class="team-list" id="projectList"></div>
                        </div>
                        <div>
                            <div class="panel-title" style="margin-bottom:10px">
                                <i data-lucide="layout-dashboard" width="17" height="17"></i>
                                <span>云端画布</span>
                            </div>
                            <div class="member-list" id="canvasList"></div>
                        </div>
                    </div>
                    <div style="margin-top:16px">
                        <div class="panel-title" style="margin-bottom:10px">
                            <i data-lucide="history" width="17" height="17"></i>
                            <span>Version history</span>
                        </div>
                        <div class="member-list" id="canvasVersionList"></div>
                    </div>
                </div>
            </section>

            <section class="panel wide">
                <div class="panel-head">
                    <div class="panel-title">
                        <i data-lucide="activity" width="18" height="18"></i>
                        <span>调用日志</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="log-list" id="generationLogSummary"></div>
                    <div class="log-list" id="generationLogList"></div>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/js/team-cloud.js?v=2026.07.29.3"></script>
</body>
</html>
