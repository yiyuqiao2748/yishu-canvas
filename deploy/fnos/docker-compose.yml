services:
  yishu-canvas:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: yishu-canvas
    user: "0:0"
    env_file:
      - .env
    environment:
      YISHU_DATA_DIR: /app/data
      YISHU_ASSETS_DIR: /app/assets
      YISHU_OUTPUT_DIR: /app/output
    volumes:
      - ./data:/app/data
      - ./api-env:/app/API
      - ./team-assets:/app/assets/team-assets
      - ./output:/app/output
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: yishu-canvas-tunnel
    network_mode: host
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      yishu-canvas:
        condition: service_healthy
    restart: unless-stopped
