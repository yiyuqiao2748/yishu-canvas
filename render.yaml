services:
  - type: web
    name: yishu-canvas
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: TEAM_AUTH_COOKIE_SECURE
        value: "1"
      - key: TEAM_AUTH_COOKIE_NAME
        value: team_cloud_access_token
      - key: TEAM_AUTH_DEV_BYPASS
        value: "0"
      - key: TEAM_ASSET_MAX_BYTES
        value: "52428800"
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
