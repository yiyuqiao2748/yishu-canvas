name: CI

on:
  push:
    branches:
      - main
      - codex/team-cloud-mvp
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          node --test tests/js/team-assets.test.js
          node --check static/js/team-assets.js
          node --check static/js/asset-manager.js
          node --check static/js/canvas-list.js
          node --check static/js/canvas.js
          node --check static/js/smart-canvas.js
          node --check static/js/team-cloud.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yishu-canvas:test .
